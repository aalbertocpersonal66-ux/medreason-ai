services:
  - type: web
    name: medreason-ai-api
    runtime: docker
    plan: free
    region: ohio
    rootDir: backend
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: LLM_API_KEY
        sync: false

  - type: web
    name: medreason-ai-web
    runtime: node
    plan: free
    region: ohio
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0 --port $PORT
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://medreason-ai-api.onrender.com
